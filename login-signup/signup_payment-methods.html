<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Payment Method - Golobe</title>

    <meta name="description" content="Add and manage your secure payment methods easily on Golobe for quick and safe travel bookings." />
    <meta property="og:title" content="Add Payment Method - Golobe" />
    <meta property="og:description" content="Add and manage your secure payment methods easily on Golobe for quick and safe travel bookings." />
    <meta property="og:image" content="../assets/image/banner.png" />
    <meta property="og:url" content="https://yourdomain.com/add-payment.html" />
    <meta property="og:type" content="website" />

    <link rel="stylesheet" href="../assets/css/input.css" />
  </head>

  <body class="bg-white m-0 p-0 font-montserrat min-h-screen flex items-center justify-center">
    <!-- MAIN CONTAINER-->
    <div class="max-w-308 w-full mx-auto p-4 md:p-8 flex flex-col lg:flex-row gap-12 lg:gap-24">
      <!-- LEFT COL: SLIDER PICTURES -->
      <div class="hidden lg:flex relative w-full max-w-122 h-200 shrink-0 mr-auto rounded-[40px] shadow-lg overflow-hidden">
        <div id="login-slider" class="flex w-full h-full transition-transform duration-700 ease-in-out transform translate-x-0">
          <img src="../assets/image/stay-slide.jpg" alt="Hotel View 1" class="max-w-122 h-full object-cover shrink-0" />
          <img src="../assets/image/flight-slide.jpg" alt="Hotel View 2" class="max-w-122 h-full object-cover shrink-0" />
          <img src="../assets/image/home-slide.jpg" alt="Hotel View 3" class="max-w-122 h-full object-cover shrink-0" />
        </div>

        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 flex items-center gap-2.5 bg-blackish-green/60 backdrop-blur-md px-4 py-2 rounded-full z-10">
          <div class="slider-dot w-6 h-2 bg-mint-green rounded-full cursor-pointer transition-all duration-300" data-slide="0"></div>
          <div class="slider-dot w-2 h-2 bg-white/70 hover:bg-white rounded-full cursor-pointer transition-all duration-300" data-slide="1"></div>
          <div class="slider-dot w-2 h-2 bg-white/70 hover:bg-white rounded-full cursor-pointer transition-all duration-300" data-slide="2"></div>
        </div>
      </div>

      <!-- RIGHT COL: FORM ADD PAYMENT -->
      <div class="w-full lg:w-160 flex flex-col gap-10">
        <!-- Logo -->
        <a href="../index.html">
          <img src="../assets/image/logo-small.png" alt="Golobe Logo" class="h-8 w-auto" />
        </a>

        <!-- Back Button -->
        <a href="signup.html" class="flex items-center text-sm font-medium text-blackish-green hover:opacity-80 transition-opacity no-underline w-fit">
          <img src="../assets/image/chevron-back_light.svg" alt="Back" class="w-6 h-6" />
          Back
        </a>

        <!-- MAIN FORM-->
        <form class="flex flex-col gap-8 w-full -mt-4" action="account_payment-methods.html" method="post">
          <div class="flex flex-col gap-6">
            <!-- Card Number -->
            <div class="relative flex items-center justify-between gap-2 border border-blackish-green/40 rounded-md px-4 focus-within:border-mint-green transition-colors">
              <label class="absolute -top-2.5 left-3 bg-white px-1 text-sm font-medium text-blackish-green z-10">Card Number</label>
              <input type="text" value="4321 4321 4321 4321" class="block w-full border-none outline-none focus:ring-0 p-0 m-0 py-4 text-base font-medium text-blackish-green bg-transparent leading-normal" />
              <img src="../assets/image/Visa_blue.svg" alt="Visa" class="w-10 h-auto object-contain shrink-0" />
            </div>

            <!-- Exp. Date & CVC -->
            <div class="flex flex-col md:flex-row gap-6 w-full">
              <!-- Exp. Date -->
              <div class="relative flex-1 block border border-blackish-green/40 rounded-md px-4 focus-within:border-mint-green transition-colors">
                <label class="absolute -top-2.5 left-3 bg-white px-1 text-sm font-medium text-blackish-green z-10">Exp. Date</label>
                <input type="text" value="02/27" class="block w-full border-none outline-none focus:ring-0 p-0 m-0 py-4 text-base font-medium text-blackish-green bg-transparent leading-normal" />
              </div>

              <!-- CVC -->
              <div class="relative flex-1 block border border-blackish-green/40 rounded-md px-4 focus-within:border-mint-green transition-colors">
                <label class="absolute -top-2.5 left-3 bg-white px-1 text-sm font-medium text-blackish-green z-10">CVC</label>
                <input type="password" value="123" class="block w-full border-none outline-none focus:ring-0 p-0 m-0 py-4 text-base font-medium text-blackish-green tracking-widest bg-transparent leading-normal" />
              </div>
            </div>

            <!-- Name on Card -->
            <div class="relative block border border-blackish-green/40 rounded-md px-4 focus-within:border-mint-green transition-colors">
              <label class="absolute -top-2.5 left-3 bg-white px-1 text-sm font-medium text-blackish-green z-10">Name on Card</label>
              <input type="text" value="John Doe" class="block w-full border-none outline-none focus:ring-0 p-0 m-0 py-4 text-base font-medium text-blackish-green bg-transparent leading-normal" />
            </div>

            <!-- Country or Region -->
            <div class="relative block border border-blackish-green/40 rounded-md px-4 focus-within:border-mint-green transition-colors">
              <label class="absolute -top-2.5 left-3 bg-white px-1 text-sm font-medium text-blackish-green z-10">Country or Region</label>
              <select class="block w-full border-none outline-none focus:ring-0 p-0 m-0 py-4 text-base font-medium text-blackish-green bg-transparent cursor-pointer appearance-none pr-8 leading-normal">
                <option value="us">United States</option>
                <option value="vn">Vietnam</option>
              </select>
              <img src="../assets/image/chevron_down.svg" alt="Dropdown" class="absolute right-3 top-1/2 -translate-y-1/2 w-5 h-5 pointer-events-none" />
            </div>

            <label class="flex items-start sm:items-center gap-3 cursor-pointer group mt-2">
              <input type="checkbox" checked class="mt-0.5 sm:mt-0 appearance-none w-5 h-5 border-2 border-blackish-green rounded-sm checked:bg-[url('../image/checkbox_light.svg')] bg-center bg-no-repeat transition-all cursor-pointer shrink-0" />
              <span class="text-sm font-medium text-blackish-green leading-tight">Securely save my information for 1-click checkout</span>
            </label>
          </div>

          <div class="flex flex-col gap-4">
            <button type="button" id="btn-complete-signup" class="flex items-center justify-center w-full h-12 bg-mint-green hover:bg-mint-green/80 text-blackish-green text-sm font-semibold rounded transition-colors cursor-pointer no-underline border-none">Add payment method</button>
            <p class="text-xs font-normal text-blackish-green/75 text-center leading-relaxed m-0 mt-2">By confirming your subscription, you allow The Outdoor Inn Crowd Limited to charge your card for this payment and future payments in accordance with their terms. You can always cancel your subscription.</p>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="../assets/js/main.js"></script>
  </body>
</html>
