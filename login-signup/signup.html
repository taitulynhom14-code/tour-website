<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Golobe</title>
    <meta name="description" content="Create a new Golobe account to get started with fast and secure travel bookings, personalized recommendations, and exclusive offers." />

    <meta property="og:title" content="Sign Up - Golobe" />
    <meta property="og:description" content="Create a new Golobe account to get started with fast and secure travel bookings and exclusive offers." />
    <meta property="og:image" content="../assets/image/banner.png" />
    <meta property="og:url" content="https://yourdomain.com/signup.html" />
    <meta property="og:type" content="website" />

    <link rel="stylesheet" href="../assets/css/input.css" />
  </head>

  <body class="bg-white m-0 p-0 font-montserrat min-h-screen flex items-center justify-center">
    <!-- MAIN CONTAINER -->
    <div class="max-w-308 w-full mx-auto p-4 md:p-8 flex flex-col lg:flex-row gap-12 lg:gap-24">
      <!-- BANNER SLIDER -->
      <div class="hidden lg:flex relative w-full max-w-122 h-200 shrink-0 mr-auto rounded-[40px] shadow-lg overflow-hidden">
        <div id="login-slider" class="flex w-full h-full transition-transform duration-700 ease-in-out transform translate-x-0">
          <img src="../assets/image/stay-slide.jpg" alt="Hotel View 1" class="max-w-122 h-full object-cover shrink-0" />
          <img src="../assets/image/flight-slide.jpg" alt="Hotel View 2" class="max-w-122 h-full object-cover shrink-0" />
          <img src="../assets/image/home-slide.jpg" alt="Hotel View 3" class="max-w-122 h-full object-cover shrink-0" />
        </div>

        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 flex items-center gap-2.5 bg-blackish-green/60 backdrop-blur-md px-4 py-2 rounded-full z-10">
          <div class="slider-dot w-6 h-2 bg-mint-green rounded-full cursor-pointer transition-all duration-300" data-slide="0"></div>
          <div class="slider-dot w-2 h-2 bg-white/70 hover:bg-white rounded-full cursor-pointer transition-all duration-300" data-slide="1"></div>
          <div class="slider-dot w-2 h-2 bg-white/70 hover:bg-white rounded-full cursor-pointer transition-all duration-300" data-slide="2"></div>
        </div>
      </div>

      <!-- FORM SIGN UP -->
      <div class="w-full lg:w-160 flex flex-col gap-16">
        <!-- Logo -->
        <a href="../index.html">
          <img src="../assets/image/logo-small.png" alt="Golobe Logo" class="h-8 w-auto" />
        </a>

        <!-- FORM -->
        <form class="flex flex-col gap-12 w-full">
          <!-- 1. Header -->
          <div class="flex flex-col gap-4">
            <h2 class="text-[40px] font-bold text-blackish-green font-trade-gothic m-0 leading-none">Sign up</h2>
            <p class="text-base font-normal text-blackish-green/75 m-0">Let's get you all set up so you can access your personal account.</p>
          </div>

          <div class="flex flex-col gap-10">
            <!-- 2. Input & Options -->
            <div class="flex flex-col gap-6">
              <!-- First Name & Last Name -->
              <div class="flex flex-col md:flex-row gap-6 w-full">
                <div class="relative flex-1 block border border-input-border rounded-md px-4 focus-within:border-mint-green transition-colors">
                  <label for="signup-firstname" class="absolute -top-2.5 left-3 bg-white px-1 text-sm font-medium text-blackish-green z-10">First Name</label>
                  <input type="text" id="signup-firstname" placeholder="John" class="block w-full bg-transparent border-none outline-none focus:ring-0 p-0 m-0 py-4 text-base font-medium text-blackish-green" />
                </div>
                <div class="relative flex-1 block border border-input-border rounded-md px-4 focus-within:border-mint-green transition-colors">
                  <label for="signup-lastname" class="absolute -top-2.5 left-3 bg-white px-1 text-sm font-medium text-blackish-green z-10">Last Name</label>
                  <input type="text" id="signup-lastname" placeholder="Doe" class="block w-full bg-transparent border-none outline-none focus:ring-0 p-0 m-0 py-4 text-base font-medium text-blackish-green" />
                </div>
              </div>

              <!-- Email & Phone Number -->
              <div class="flex flex-col md:flex-row gap-6 w-full">
                <div class="relative flex-1 block border border-input-border rounded-md px-4 focus-within:border-mint-green transition-colors">
                  <label for="signup-email" class="absolute -top-2.5 left-3 bg-white px-1 text-sm font-medium text-blackish-green z-10">Email</label>
                  <input type="email" id="signup-email" placeholder="john.doe@gmail.com" class="block w-full bg-transparent border-none outline-none focus:ring-0 p-0 m-0 py-4 text-base font-medium text-blackish-green" />
                </div>
                <div class="relative flex-1 block border border-input-border rounded-md px-4 focus-within:border-mint-green transition-colors">
                  <label for="signup-phone" class="absolute -top-2.5 left-3 bg-white px-1 text-sm font-medium text-blackish-green z-10">Phone Number</label>
                  <input type="tel" id="signup-phone" placeholder="0123456789" class="block w-full bg-transparent border-none outline-none focus:ring-0 p-0 m-0 py-4 text-base font-medium text-blackish-green" />
                </div>
              </div>

              <!-- Password Input -->
              <div class="relative flex items-center justify-between gap-2 border border-input-border rounded-md px-4 focus-within:border-mint-green transition-colors">
                <label for="signup-password" class="absolute -top-2.5 left-3 bg-white px-1 text-sm font-medium text-blackish-green z-10">Password</label>
                <input type="password" id="signup-password" placeholder="••••••••" class="block w-full bg-transparent border-none outline-none focus:ring-0 p-0 m-0 py-4 text-base font-bold tracking-widest text-blackish-green" />
                <button type="button" class="btn-toggle-password w-6 h-6 shrink-0 flex items-center justify-center cursor-pointer border-none bg-transparent p-0 m-0">
                  <img src="../assets/image/eye-off_light.svg" alt="Toggle Password" class="w-full h-full opacity-75 hover:opacity-100 transition-opacity" />
                </button>
              </div>

              <!-- Confirm Password Input -->
              <div class="relative flex items-center justify-between gap-2 border border-input-border rounded-md px-4 focus-within:border-mint-green transition-colors">
                <label for="signup-confirm-password" class="absolute -top-2.5 left-3 bg-white px-1 text-sm font-medium text-blackish-green z-10">Confirm Password</label>
                <input type="password" id="signup-confirm-password" placeholder="••••••••" class="block w-full bg-transparent border-none outline-none focus:ring-0 p-0 m-0 py-4 text-base font-bold tracking-widest text-blackish-green" />
                <button type="button" class="btn-toggle-password w-6 h-6 shrink-0 flex items-center justify-center cursor-pointer border-none bg-transparent p-0 m-0">
                  <img src="../assets/image/eye-off_light.svg" alt="Toggle Password" class="w-full h-full opacity-75 hover:opacity-100 transition-opacity" />
                </button>
              </div>

              <!-- Options: Agree to Terms -->
              <div class="flex items-start mt-2">
                <label class="flex items-start sm:items-center gap-2 cursor-pointer group w-full">
                  <input type="checkbox" id="signup-terms" class="shrink-0 mt-0.5 sm:mt-0 appearance-none w-5 h-5 border-2 border-blackish-green rounded-sm checked:bg-[url('../image/checkbox_light.svg')] bg-center bg-no-repeat transition-all cursor-pointer" />
                  <span class="text-sm font-medium text-blackish-green leading-tight">I agree to all the <a href="#" class="text-slamon hover:underline no-underline">Terms</a> and <a href="#" class="text-slamon hover:underline no-underline">Privacy Policies</a></span>
                </label>
              </div>
            </div>

            <!-- 3. Button & Login -->
            <div class="flex flex-col gap-4">
              <button type="button" id="btn-signup" class="flex items-center justify-center w-full h-12 bg-mint-green hover:bg-mint-green/80 text-blackish-green text-sm font-semibold rounded transition-colors cursor-pointer border-none">Create account</button>
              <p class="text-sm font-medium text-blackish-green text-center m-0">
                Already have an account?
                <a href="login.html" class="font-semibold text-slamon hover:underline no-underline">Login</a>
              </p>
            </div>

            <!-- 4. OR -->
            <div class="flex items-center gap-4 w-full">
              <div class="flex-1 h-px bg-blackish-green/20"></div>
              <span class="text-sm font-normal text-blackish-green/50 px-2 whitespace-nowrap">Or Sign up with</span>
              <div class="flex-1 h-px bg-blackish-green/20"></div>
            </div>

            <!-- 5. Button Social -->
            <div class="grid grid-cols-3 gap-4 w-full">
              <button type="button" class="flex items-center justify-center h-14 bg-transparent border border-solid border-mint-green rounded hover:bg-mint-cream transition-colors w-full cursor-pointer">
                <img src="../assets/image/facebook_icon.svg" alt="Facebook" class="w-6 h-6" />
              </button>

              <button type="button" class="flex items-center justify-center h-14 bg-transparent border border-solid border-mint-green rounded hover:bg-mint-cream transition-colors w-full cursor-pointer">
                <img src="../assets/image/google_icon.svg" alt="Google" class="w-6 h-6" />
              </button>

              <button type="button" class="flex items-center justify-center h-14 bg-transparent border border-solid border-mint-green rounded hover:bg-mint-cream transition-colors w-full cursor-pointer">
                <img src="../assets/image/apple_icon.svg" alt="Apple" class="w-6 h-6" />
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="../assets/js/main.js"></script>
  </body>
</html>
