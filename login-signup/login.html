<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Golobe</title>

    <meta name="description" content="Log in to your Golobe account to manage bookings, view travel history, and access personalized features." />
    <meta property="og:title" content="Login - Golobe" />
    <meta property="og:description" content="Log in to your Golobe account to manage bookings, view travel history, and access personalized features." />
    <meta property="og:image" content="../assets/image/banner.png" />
    <meta property="og:url" content="https://yourdomain.com/login.html" />
    <meta property="og:type" content="website" />

    <link rel="stylesheet" href="../assets/css/input.css" />
  </head>
  <body class="bg-white m-0 p-0 font-montserrat min-h-screen flex items-center justify-center">
    <!-- MAIN CONTAINER-->
    <div class="max-w-308 w-full mx-auto p-4 md:p-8 flex flex-col lg:flex-row gap-12 lg:gap-24">
      <!-- FORM LOGIN -->
      <div class="w-full lg:w-125 flex flex-col gap-16">
        <!-- Logo -->
        <a href="../index.html">
          <img src="../assets/image/logo-small.png" alt="Golobe Logo" class="h-8 w-auto" />
        </a>

        <!-- FORM -->
        <form class="flex flex-col gap-12 w-full">
          <!-- 1. Header -->
          <div class="flex flex-col gap-4">
            <h2 class="text-[40px] font-bold text-blackish-green font-trade-gothic m-0 leading-none">Login</h2>
            <p class="text-base font-normal text-blackish-green/75 m-0">Login to access your Golobe account</p>
          </div>

          <div class="flex flex-col gap-10">
            <div class="flex flex-col gap-6">
              <!-- Email Input (Đã thêm ID và sửa value thành placeholder) -->
              <div class="relative flex items-center border border-input-border rounded-md px-4 h-14 focus-within:border-mint-green transition-colors">
                <label for="login-email" class="absolute -top-2.5 left-3 bg-white px-1 text-sm font-medium text-blackish-green">Email</label>
                <input type="email" id="login-email" placeholder="john.doe@gmail.com" class="w-full border-none outline-none text-base font-medium text-blackish-green bg-transparent" />
              </div>

              <!-- Password Input (Đã thêm ID và sửa value thành placeholder) -->
              <div class="relative flex items-center border border-input-border rounded-md px-4 h-14 focus-within:border-mint-green transition-colors">
                <label for="login-password" class="absolute -top-2.5 left-3 bg-white px-1 text-sm font-medium text-blackish-green">Password</label>
                <input type="password" id="login-password" placeholder="••••••••" class="w-full border-none outline-none text-base font-bold tracking-widest text-blackish-green bg-transparent" />
                <button type="button" class="ml-2 w-6 h-6 flex items-center justify-center cursor-pointer shrink-0 border-none bg-transparent">
                  <img src="../assets/image/eye-off_light.svg" alt="Toggle Password" class="w-full h-full opacity-75 hover:opacity-100 transition-opacity" />
                </button>
              </div>

              <!-- Options: Remember & Forgot -->
              <div class="flex items-center justify-between">
                <label class="flex items-center gap-2 cursor-pointer group">
                  <input type="checkbox" class="appearance-none w-5 h-5 border-2 border-blackish-green rounded-sm checked:bg-[url('../image/checkbox_light.svg')] bg-center bg-no-repeat transition-all cursor-pointer" />
                  <span class="text-sm font-medium text-blackish-green">Remember me</span>
                </label>

                <a href="forgotpass.html" class="text-sm font-medium text-slamon hover:underline no-underline">Forgot Password</a>
              </div>
            </div>
            <!-- 3. Button Login & Signup -->
            <div class="flex flex-col gap-4">
              <button type="button" id="btn-login" class="flex items-center justify-center w-full h-12 bg-mint-green hover:bg-mint-green/80 text-blackish-green text-sm font-semibold rounded transition-colors cursor-pointer border-none">Login</button>
              <p class="text-sm font-medium text-blackish-green text-center m-0">
                Don't have an account?
                <a href="signup.html" class="font-semibold text-slamon hover:underline no-underline">Sign up</a>
              </p>
            </div>

            <!-- 4. OR -->
            <div class="flex items-center gap-4 w-full">
              <div class="flex-1 h-px bg-blackish-green/20"></div>
              <span class="text-sm font-normal text-blackish-green/50 px-2">Or login with</span>
              <div class="flex-1 h-px bg-blackish-green/20"></div>
            </div>

            <!-- 5. Social Button -->
            <div class="grid grid-cols-3 gap-4 w-full">
              <!-- Facebook -->
              <button type="button" class="flex items-center justify-center h-14 bg-transparent border border-solid border-mint-green rounded hover:bg-mint-cream transition-colors w-full cursor-pointer">
                <img src="../assets/image/facebook_icon.svg" alt="Facebook" class="w-6 h-6" />
              </button>

              <!-- Google -->
              <button type="button" class="flex items-center justify-center h-14 bg-transparent border border-solid border-mint-green rounded hover:bg-mint-cream transition-colors w-full cursor-pointer">
                <img src="../assets/image/google_icon.svg" alt="Google" class="w-6 h-6" />
              </button>

              <!-- Apple -->
              <button type="button" class="flex items-center justify-center h-14 bg-transparent border border-solid border-mint-green rounded hover:bg-mint-cream transition-colors w-full cursor-pointer">
                <img src="../assets/image/apple_icon.svg" alt="Apple" class="w-6 h-6" />
              </button>
            </div>
          </div>
        </form>
      </div>

      <!-- BANNER SLIDER -->
      <div class="hidden lg:flex relative w-full max-w-150 h-200 shrink-0 ml-auto rounded-[40px] shadow-lg overflow-hidden">
        <div id="login-slider" class="flex w-full h-full transition-transform duration-700 ease-in-out transform translate-x-0">
          <img src="../assets/image/stay-slide.jpg" alt="Banner View 1" class="w-full h-full object-cover shrink-0" />
          <img src="../assets/image/flight-slide.jpg" alt="Banner View 2" class="w-full h-full object-cover shrink-0" />
          <img src="../assets/image/home-slide.jpg" alt="Banner View 3" class="w-full h-full object-cover shrink-0" />
        </div>

        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 flex items-center gap-2.5 bg-blackish-green/60 backdrop-blur-md px-4 py-2 rounded-full z-10">
          <!-- Dot 1 (Active) -->
          <div class="slider-dot w-6 h-2 bg-mint-green rounded-full cursor-pointer transition-all duration-300" data-slide="0"></div>
          <!-- Dot 2 -->
          <div class="slider-dot w-2 h-2 bg-white/70 hover:bg-white rounded-full cursor-pointer transition-all duration-300" data-slide="1"></div>
          <!-- Dot 3 -->
          <div class="slider-dot w-2 h-2 bg-white/70 hover:bg-white rounded-full cursor-pointer transition-all duration-300" data-slide="2"></div>
        </div>
      </div>
    </div>

    <script type="module" src="../assets/js/main.js"></script>
  </body>
</html>
