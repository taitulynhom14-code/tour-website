<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - Golobe</title>
    <meta name="description" content="Recover your Golobe account password easily by following the step-by-step verification process." />

    <meta property="og:description" content="Recover your Golobe account password easily by following the step-by-step verification process." />
    <meta property="og:image" content="../assets/image/banner.png" />
    <meta property="og:url" content="https://yourdomain.com/forgotpass.html" />
    <meta property="og:type" content="website" />

    <link rel="stylesheet" href="../assets/css/input.css" />
  </head>

  <body class="bg-white m-0 p-0 font-montserrat min-h-screen flex items-center justify-center">
    <!-- MAIN CONTAINER-->
    <div class="max-w-308 w-full mx-auto p-4 md:p-8 flex flex-col lg:flex-row gap-12 lg:gap-24">
      <!-- FORM FORGOT PASSWORD -->
      <div class="w-full lg:w-125 flex flex-col gap-16">
        <!-- Logo -->
        <a href="../index.html">
          <img src="../assets/image/logo-small.png" alt="Golobe Logo" class="h-8 w-auto" />
        </a>

        <!-- FORM -->
        <form class="flex flex-col gap-12 w-full">
          <!-- 1. Header & Back to Login -->
          <div class="flex flex-col gap-4">
            <!-- Button Back -->
            <a href="login.html" class="flex items-center text-sm font-medium text-blackish-green hover:opacity-80 transition-opacity no-underline w-fit">
              <img src="../assets/image/chevron-back_light.svg" alt="Back" class="w-6 h-6" />
              Back to login
            </a>

            <h2 class="text-[40px] font-bold text-blackish-green font-trade-gothic m-0 leading-none">Forgot your password?</h2>
            <p class="text-base font-normal text-blackish-green/75 m-0 leading-relaxed pr-10">Don't worry, happens to all of us. Enter your email below to recover your password</p>
          </div>

          <div class="flex flex-col gap-10">
            <!-- 2. Input Email -->
            <div class="flex flex-col gap-6">
              <!-- Email Input -->
              <div class="relative flex items-center border border-input-border rounded-md px-4 h-14 focus-within:border-mint-green transition-colors">
                <label for="forgot-email" class="absolute -top-2.5 left-3 bg-white px-1 text-sm font-medium text-blackish-green">Email</label>
                <input id="forgot-email" type="email" value="john.doe@gmail.com" class="w-full border-none outline-none text-base font-medium text-blackish-green bg-transparent" />
              </div>
            </div>

            <!-- 3. Button Submit -->
            <div class="flex flex-col gap-4 -mt-2">
              <a href="forgotpass_verify.html" class="flex items-center justify-center w-full h-12 bg-mint-green hover:bg-mint-green/80 text-blackish-green text-sm font-semibold rounded transition-colors cursor-pointer no-underline">Submit</a>
            </div>

            <!-- 4. OR -->
            <div class="flex items-center gap-4 w-full">
              <div class="flex-1 h-px bg-blackish-green/20"></div>
              <span class="text-sm font-normal text-blackish-green/50 px-2">Or login with</span>
              <div class="flex-1 h-px bg-blackish-green/20"></div>
            </div>

            <!-- 5. Button Social -->
            <div class="grid grid-cols-3 gap-4 w-full">
              <!-- Facebook -->
              <button type="button" class="flex items-center justify-center h-14 bg-transparent border border-solid border-mint-green rounded hover:bg-mint-cream transition-colors w-full cursor-pointer">
                <img src="../assets/image/facebook_icon.svg" alt="Facebook" class="w-6 h-6" />
              </button>

              <!-- Google -->
              <button type="button" class="flex items-center justify-center h-14 bg-transparent border border-solid border-mint-green rounded hover:bg-mint-cream transition-colors w-full cursor-pointer">
                <img src="../assets/image/google_icon.svg" alt="Google" class="w-6 h-6" />
              </button>

              <!-- Apple -->
              <button type="button" class="flex items-center justify-center h-14 bg-transparent border border-solid border-mint-green rounded hover:bg-mint-cream transition-colors w-full cursor-pointer">
                <img src="../assets/image/apple_icon.svg" alt="Apple" class="w-6 h-6" />
              </button>
            </div>
          </div>
        </form>
      </div>

      <!-- BANNER SLIDER -->
      <div class="hidden lg:flex relative w-full max-w-150 h-200 shrink-0 ml-auto rounded-[40px] shadow-lg overflow-hidden">
        <div id="login-slider" class="flex w-full h-full transition-transform duration-700 ease-in-out transform translate-x-0">
          <img src="../assets/image/stay-slide.jpg" alt="Banner View 1" class="w-full h-full object-cover shrink-0" />
          <img src="../assets/image/flight-slide.jpg" alt="Banner View 2" class="w-full h-full object-cover shrink-0" />
          <img src="../assets/image/home-slide.jpg" alt="Banner View 3" class="w-full h-full object-cover shrink-0" />
        </div>

        <!-- Indicators  -->
        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 flex items-center gap-2.5 bg-blackish-green/60 backdrop-blur-md px-4 py-2 rounded-full z-10">
          <!-- Dot 1 -->
          <div class="slider-dot w-6 h-2 bg-mint-green rounded-full cursor-pointer transition-all duration-300" data-slide="0"></div>
          <!-- Dot 2 -->
          <div class="slider-dot w-2 h-2 bg-white/70 hover:bg-white rounded-full cursor-pointer transition-all duration-300" data-slide="1"></div>
          <!-- Dot 3 -->
          <div class="slider-dot w-2 h-2 bg-white/70 hover:bg-white rounded-full cursor-pointer transition-all duration-300" data-slide="2"></div>
        </div>
      </div>
    </div>

    <script type="module" src="../assets/js/main.js"></script>
  </body>
</html>
