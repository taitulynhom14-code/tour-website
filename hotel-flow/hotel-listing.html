<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golobe - Tour Website</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tìm kiếm và đặt phòng khách sạn, motel, resort tiện nghi với giá tốt nhất cùng bộ lọc thông minh trên Golobe." />
    <meta property="og:title" content="Danh Sách Khách Sạn - Hotel Listing | Golobe" />
    <meta property="og:description" content="Tìm kiếm và đặt phòng khách sạn, motel, resort tiện nghi với giá tốt nhất trên Golobe." />
    <meta property="og:image" content="../assets/image/banner.png" />
    <meta property="og:url" content="https://yourdomain.com/hotel-listing.html" />
    <meta property="og:type" content="website" />

    <link rel="stylesheet" href="../assets/css/input.css" />
  </head>

  <body>
    {{> header stays_active="nav-active" mb_class="mb-12" }}

    <section class="max-w-308 mx-auto mb-12">
      <form class="bg-white rounded-2xl shadow-md p-6" action="hotel-listing.html" method="get">
        <div class="grid grid-cols-1 lg:grid-cols-14 gap-4 lg:gap-6 items-center">
          <div class="relative flex items-center border border-input-border rounded-lg px-4 h-14 lg:col-span-4 focus-within:border-mint-green transition-colors">
            <label class="floating-label" for="destination">Enter Destination</label>
            <div class="flex items-center gap-3 w-full">
              <img src="../assets/image/bed_light.svg" alt="bed icon" class="w-6 h-6 shrink-0" />
              <input class="w-full border-none outline-none text-base font-medium text-blackish-green bg-transparent placeholder:text-blackish-green/50" id="destination" type="text" name="destination" value="Istanbul, Turkey" placeholder="name city" />
            </div>
          </div>

          <!-- Check In -->
          <div class="input-group lg:col-span-3">
            <label class="floating-label" for="checkin">Check In</label>
            <div class="flex items-center justify-between w-full gap-3">
              <input class="w-full border-none outline-none text-base font-medium text-blackish-green bg-transparent placeholder:text-blackish-green/50 [&::-webkit-calendar-picker-indicator]:hidden" id="checkin" type="date" name="checkin" required />
              <img src="../assets/image/calendar_light.svg" id="checkin-icon" alt="calendar icon" class="w-6 h-6 shrink-0 cursor-pointer" />
            </div>
          </div>

          <!-- Check Out -->
          <div class="input-group lg:col-span-3">
            <label class="floating-label" for="checkout">Check Out</label>
            <div class="flex items-center justify-between w-full gap-3">
              <input class="w-full border-none outline-none text-base font-medium text-blackish-green bg-transparent placeholder:text-blackish-green/50 [&::-webkit-calendar-picker-indicator]:hidden" id="checkout" type="date" name="checkout" required />
              <img src="../assets/image/calendar_light.svg" id="checkout-icon" alt="calendar icon" class="w-6 h-6 shrink-0 cursor-pointer" />
            </div>
          </div>

          <div class="input-group lg:col-span-3">
            <label class="floating-label" for="guests">Rooms & Guests</label>
            <div class="flex items-center gap-3 w-full">
              <img src="../assets/image/user_light.svg" alt="user icon" class="w-6 h-6 shrink-0" />
              <input class="w-full border-none outline-none text-base font-medium text-blackish-green bg-transparent placeholder:text-blackish-green/50 cursor-pointer" id="guests" type="text" name="guests" value="1 room, 2 guests" readonly />
              <img src="../assets/image/chevron_down.svg" alt="expand icon" class="w-6 h-6 shrink-0" />
            </div>
          </div>

          <button class="bg-mint-green hover:bg-mint-green/80 text-blackish-green h-14 rounded-lg flex items-center justify-center transition-colors lg:col-span-1 w-full" type="submit" aria-label="Search Hotels">
            <img src="../assets/image/search_light.svg" alt="search" class="w-6 h-6" />
          </button>
        </div>
      </form>
    </section>

    <div class="max-w-308 mx-auto grid grid-cols-1 lg:grid-cols-12 gap-y-8 lg:gap-8 my-8 px-4">
      <aside class="flex flex-col gap-8 lg:col-span-3">
        <h2 class="text-xl font-semibold text-blackish-green leading-tight">Filters</h2>

        <div class="flex flex-col">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-base font-semibold text-blackish-green leading-tight">Price</h3>
            <img class="cursor-pointer" src="../assets/image/chevron_up.svg" alt="toggle" />
          </div>

          <div class="relative w-full h-12">
            <div class="absolute top-3 w-full h-0.5 rounded bg-blackish-green/10"></div>
            <div id="slider-fill" class="absolute top-3 h-0.5 rounded bg-blackish-green"></div>
            <input type="range" id="slider-min" aria-label="Minimum price" class="absolute top-0 w-full appearance-none bg-transparent pointer-events-none [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:pointer-events-auto [&::-webkit-slider-thumb]:w-6 [&::-webkit-slider-thumb]:h-6 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-mint-green [&::-webkit-slider-thumb]:cursor-pointer [&::-webkit-slider-thumb]:shadow-md m-0" min="50" max="1200" value="50" step="10" />
            <input type="range" id="slider-max" aria-label="Maximum price" class="absolute top-0 w-full appearance-none bg-transparent pointer-events-none [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:pointer-events-auto [&::-webkit-slider-thumb]:w-6 [&::-webkit-slider-thumb]:h-6 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-mint-green [&::-webkit-slider-thumb]:cursor-pointer [&::-webkit-slider-thumb]:shadow-md m-0" min="50" max="1200" value="1200" step="10" />
            <div class="flex justify-between absolute top-8 w-full">
              <span id="label-min" class="text-xs font-medium text-blackish-green">$50</span>
              <span id="label-max" class="text-xs font-medium text-blackish-green">$1200</span>
            </div>
          </div>
        </div>
        <div class="h-px w-full bg-blackish-green/25"></div>

        <div class="flex flex-col">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-base font-semibold text-blackish-green leading-tight">Rating</h3>
            <img class="cursor-pointer" src="../assets/image/chevron_up.svg" alt="toggle" />
          </div>

          <div class="grid grid-cols-5 gap-2">
            <label class="cursor-pointer text-center">
              <input type="checkbox" name="rating" value="0" class="peer hidden" />
              <span class="filter-rating-btn">0+</span>
            </label>
            <label class="cursor-pointer text-center">
              <input type="checkbox" name="rating" value="1" class="peer hidden" />
              <span class="filter-rating-btn">1+</span>
            </label>
            <label class="cursor-pointer text-center">
              <input type="checkbox" name="rating" value="2" class="peer hidden" />
              <span class="filter-rating-btn">2+</span>
            </label>
            <label class="cursor-pointer text-center">
              <input type="checkbox" name="rating" value="3" class="peer hidden" />
              <span class="filter-rating-btn">3+</span>
            </label>
            <label class="cursor-pointer text-center">
              <input type="checkbox" name="rating" value="4" class="peer hidden" />
              <span class="filter-rating-btn">4+</span>
            </label>
          </div>
        </div>
        <div class="h-px w-full bg-blackish-green/25"></div>

        <div class="flex flex-col">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-base font-semibold text-blackish-green leading-tight">Freebies</h3>
            <img class="cursor-pointer" src="../assets/image/chevron_up.svg" alt="toggle" />
          </div>

          <div class="flex flex-col gap-2">
            <label class="filter-label group">
              <input type="checkbox" name="freebies" value="breakfast" class="filter-checkbox" />
              <span class="filter-text">Free breakfast</span>
            </label>
            <label class="filter-label group">
              <input type="checkbox" name="freebies" value="parking" class="filter-checkbox" />
              <span class="filter-text">Free parking</span>
            </label>
            <label class="filter-label group">
              <input type="checkbox" name="freebies" value="internet" class="filter-checkbox" />
              <span class="filter-text">Free internet</span>
            </label>
            <label class="filter-label group">
              <input type="checkbox" name="freebies" value="shuttle" class="filter-checkbox" />
              <span class="filter-text">Free airport shuttle</span>
            </label>
            <label class="filter-label group">
              <input type="checkbox" name="freebies" value="cancellation" class="filter-checkbox" />
              <span class="filter-text">Free Cancellation</span>
            </label>
          </div>
        </div>

        <div class="h-px w-full bg-blackish-green/25"></div>

        <div class="flex flex-col">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-base font-semibold text-blackish-green leading-tight">Amenities</h3>
            <img class="cursor-pointer" src="../assets/image/chevron_up.svg" alt="toggle" />
          </div>

          <div class="flex flex-col gap-2">
            <label class="filter-label group">
              <input type="checkbox" name="amenities" value="24hr_front_desk" class="filter-checkbox" />
              <span class="filter-text">24hr front desk</span>
            </label>
            <label class="filter-label group">
              <input type="checkbox" name="amenities" value="air_conditioned" class="filter-checkbox" />
              <span class="filter-text">Air-conditioned</span>
            </label>
            <label class="filter-label group">
              <input type="checkbox" name="amenities" value="fitness" class="filter-checkbox" />
              <span class="filter-text">Fitness</span>
            </label>
            <label class="filter-label group">
              <input type="checkbox" name="amenities" value="pool" class="filter-checkbox" />
              <span class="filter-text">Pool</span>
            </label>
          </div>
        </div>
      </aside>

      <main class="flex flex-col lg:col-span-9 gap-8 lg:border-l lg:border-blackish-green/25 lg:pl-8">
        <header class="relative grid grid-cols-3 bg-white rounded-xl shadow-[0_4px_16px_0_rgba(17,34,17,0.05)] py-4">
          <button class="hotel-listing__tab hotel-listing__tab--active relative flex flex-col items-start px-6 gap-2" data-target="hotels-list">
            <h3 class="text-base font-semibold text-blackish-green leading-none m-0">Hotels</h3>
            <p class="text-sm font-normal text-blackish-green/40 leading-none m-0">257 places</p>
          </button>

          <button class="hotel-listing__tab flex flex-col items-start px-6 gap-2 border-x border-solid border-[#D7E2EE]" data-target="motels-list">
            <h3 class="text-base font-semibold text-blackish-green leading-none m-0">Motels</h3>
            <p class="text-sm font-normal text-blackish-green/40 leading-none m-0">51 places</p>
          </button>

          <button class="hotel-listing__tab flex flex-col items-start px-6 gap-2" data-target="resorts-list">
            <h3 class="text-base font-semibold text-blackish-green leading-none m-0">Resorts</h3>
            <p class="text-sm font-normal text-blackish-green/40 leading-none m-0">72 places</p>
          </button>

          <div class="slide-indicator absolute -bottom-0 h-1 bg-mint-green rounded-full transition-all duration-300 ease-in-out"></div>
        </header>

        <div class="flex justify-between items-center">
          <p class="text-sm font-semibold text-blackish-green leading-none" id="result-count">Showing 4 of <span class="text-slamon">257 places</span></p>

          <div class="group relative flex items-center gap-2" id="sort-dropdown">
            <span class="text-sm font-normal text-blackish-green">Sort by</span>

            <div class="relative">
              <button class="sort-dropdown__trigger flex items-center gap-1 bg-transparent border-none cursor-pointer p-0 text-sm font-semibold text-blackish-green" type="button">
                <span class="sort-dropdown__selected">Recommended</span>
                <img src="../assets/image/chevron_down.svg" alt="" class="w-4 h-4 transition-transform duration-200 group-[.is-open]:rotate-180" />
              </button>

              <ul class="sort-dropdown__options absolute top-[calc(100%+8px)] right-0 bg-white rounded-lg shadow-md py-2 min-w-[180px] m-0 z-50 opacity-0 invisible -translate-y-2 transition-all duration-200 group-[.is-open]:opacity-100 group-[.is-open]:visible group-[.is-open]:translate-y-0">
                <li class="sort-dropdown__option sort-dropdown__option--active px-4 py-2 cursor-pointer text-sm font-semibold text-mint-green hover:bg-gray-100 transition-colors" data-value="recommended">Recommended</li>
                <li class="sort-dropdown__option px-4 py-2 cursor-pointer text-sm text-blackish-green hover:bg-gray-100 transition-colors" data-value="ascending">Ascending</li>
                <li class="sort-dropdown__option px-4 py-2 cursor-pointer text-sm text-blackish-green hover:bg-gray-100 transition-colors" data-value="descending">Descending</li>
              </ul>
            </div>
            <input type="hidden" name="sort" id="sort-input" value="recommended" />
          </div>
        </div>

        <ul class="flex flex-col gap-6 m-0 p-0 list-none hotel-list-container"></ul>
      </main>
    </div>
    <div class="max-w-308 mx-auto px-4 md:px-8 grid grid-cols-1 lg:grid-cols-12 mb-12 lg:gap-8">
      <div class="lg:col-span-9 lg:col-start-4 lg:pl-8">
        <button class="w-full py-4 bg-blackish-green hover:opacity-90 text-white text-sm font-semibold leading-none rounded transition-opacity cursor-pointer border-none text-center">Show more results</button>
      </div>
    </div>

    {{> footer }}

    <script type="module" src="../assets/js/main.js"></script>
  </body>
</html>
