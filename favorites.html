<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golobe - Tour Website</title>
    <meta name="description" content="View and manage your favorite saved hotels, flights, and dream travel destinations on Golobe." />
    <meta property="og:title" content="Favorites - Golobe Tour Website" />
    <meta property="og:description" content="View and manage your favorite saved hotels, flights, and dream travel destinations on Golobe." />
    <meta property="og:image" content="assets/image/cvk-park-bosphorus-hotel.png" />
    <meta property="og:url" content="https://yourdomain.com/favorites.html" />
    <meta property="og:type" content="website" />

    <link rel="stylesheet" href="./assets/css/input.css" />
  </head>

  <body>
    {{> header favourites_active="nav-active" mb_class="mb-12" is_logged_in=true }}

    <!-- FAVORITES CONTENT -->
    <main class="w-full max-w-7xl mx-auto px-4 lg:px-8 flex flex-col gap-8">
      <!-- TITLE -->
      <h1 class="text-3xl font-bold text-blackish-green leading-none m-0">Favorites</h1>

      <!-- TABS HEADER -->
      <header class="relative grid grid-cols-2 bg-white rounded-xl shadow-[0_4px_16px_0_rgba(17,34,17,0.05)] py-4">
        <!-- Tab 1: Flights (Inactive) -->
        <button class="hotel-listing__tab relative flex flex-col items-start px-8 gap-2 border-none bg-transparent cursor-pointer group" data-target="flights-list">
          <h3 class="text-base font-semibold text-blackish-green leading-none m-0">Flights</h3>
          <p class="text-sm font-normal text-blackish-green/40 leading-none m-0">2 marked</p>
        </button>

        <!-- Tab 2: Places (Active) -->
        <button class="hotel-listing__tab hotel-listing__tab--active relative flex flex-col items-start px-8 gap-2 border-l-2 border-solid border-[#D7E2EE] bg-transparent cursor-pointer group" data-target="places-list">
          <h3 class="text-base font-semibold text-blackish-green leading-none m-0">Places</h3>
          <p class="text-sm font-normal text-blackish-green/40 leading-none m-0">3 marked</p>
        </button>

        <div class="slide-indicator absolute bottom-0 h-1 bg-mint-green rounded-full transition-all duration-300 ease-in-out"></div>
      </header>

      <!-- FAVORITES LISTING -->
      <ul id="favorites-list" class="flex flex-col gap-6 m-0 p-0 list-none"></ul>
    </main>

    <!-- FOOTER -->
    {{> footer }}

    <script type="module" src="./assets/js/main.js"></script>
  </body>
</html>
